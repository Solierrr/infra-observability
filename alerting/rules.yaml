apiVersion: 1
groups:
- orgId: 1
  name: SOLIER — P1 (agir já)
  folder: SOLIER
  interval: 1m
  rules:
  - uid: solier-a02
    title: A02 Erros 5xx acima de 10 %
    condition: C
    for: 2m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: ((((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0))) > 10) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          > 0.05)) or ((((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0))) > 10) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          > 0.05))
        datasource:
          type: prometheus
          uid: prometheus
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}): {{ printf "%.1f" $values.B.Value }} % de respostas 5xx'
      description: Taxa de erros 5xx acima de 10 % por 2 minutos, com tráfego mínimo de 0,05 req/s.
      impact: 'Mais de 1 em cada 10 requisições falha: o serviço está praticamente quebrado.'
      first_steps: 1. Abrir o dashboard do serviço e achar a rota com mais erro. 2. Ver os logs de erro e os traces com erro. 3. Checar a última
        publicação do serviço.
      dashboard: '{{ if or (eq $labels.service_name "auth") (eq $labels.service_name "core") (eq $labels.service_name "messager") (eq $labels.service_name
        "api-notify") }}/d/solier-servico-java{{ else }}/d/solier-servico-python{{ end }}?var-service={{ $labels.service_name }}&var-environment={{
        $labels.deployment_environment }}'
    labels:
      alert_id: A02
      priority: P1
      category: erros
      team: solier
      escalation_group: erro-5xx
  - uid: solier-a03
    title: A03 Erros 5xx sustentados
    condition: C
    for: 0s
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (((min_over_time(((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0)))[10m:1m]) >= 5) unless (((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0))) > 10)) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          > 0.05)) or (((min_over_time(((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0)))[10m:1m]) >= 5) unless (((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0))) > 10)) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          > 0.05))
        datasource:
          type: prometheus
          uid: prometheus
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}): {{ printf "%.1f" $values.B.Value }} % de respostas 5xx há 10
        min'
      description: Taxa de erros 5xx de 5 % ou mais durante 10 minutos seguidos (e até 10 %; acima disso vale o alerta A02).
      impact: 'Pelo menos 1 em cada 20 requisições falha há 10 minutos: degradação contínua.'
      first_steps: Mesmos passos do A02. Confirmar se começou depois de uma publicação.
      dashboard: '{{ if or (eq $labels.service_name "auth") (eq $labels.service_name "core") (eq $labels.service_name "messager") (eq $labels.service_name
        "api-notify") }}/d/solier-servico-java{{ else }}/d/solier-servico-python{{ end }}?var-service={{ $labels.service_name }}&var-environment={{
        $labels.deployment_environment }}'
    labels:
      alert_id: A03
      priority: P1
      category: erros
      team: solier
      escalation_group: erro-5xx
- orgId: 1
  name: SOLIER — P2 (poucas horas)
  folder: SOLIER
  interval: 1m
  rules:
  - uid: solier-a01
    title: A01 Serviço sem dados
    condition: C
    for: 5m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (count by (service_name,deployment_environment) (last_over_time(http_server_requests_milliseconds_count{deployment_environment="prod",service_name=~"auth|core|messager|api-notify"}[1h]))
          unless count by (service_name,deployment_environment) (http_server_requests_milliseconds_count{deployment_environment="prod",service_name=~"auth|core|messager|api-notify"}))
          or (count by (service_name,deployment_environment) (last_over_time(http_server_duration_milliseconds_count{deployment_environment="prod",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[1h]))
          unless count by (service_name,deployment_environment) (http_server_duration_milliseconds_count{deployment_environment="prod",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}))
        datasource:
          type: prometheus
          uid: prometheus
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}) parou de enviar telemetria'
      description: Enviava métricas na última hora e não envia mais há 5 minutos.
      impact: O serviço pode estar fora do ar ou sem conexão com o collector. Quem depende dele recebe erro.
      first_steps: 1. Ver se o pod está de pé (kubectl get pods). 2. Ver os logs do pod. 3. Ver se o collector recebe dados (painel Saúde geral).
      dashboard: '{{ if or (eq $labels.service_name "auth") (eq $labels.service_name "core") (eq $labels.service_name "messager") (eq $labels.service_name
        "api-notify") }}/d/solier-servico-java{{ else }}/d/solier-servico-python{{ end }}?var-service={{ $labels.service_name }}&var-environment={{
        $labels.deployment_environment }}'
    labels:
      alert_id: A01
      priority: P2
      category: disponibilidade
      team: solier
  - uid: solier-a04
    title: A04 Erros 5xx altos
    condition: C
    for: 5m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (((((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0))) >= 5) unless (((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0))) > 10) unless (min_over_time(((100 * (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",status=~"5..",service_name=~"auth|core|messager|api-notify"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m]))
          > 0)))[10m:1m]) >= 5)) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager|api-notify"}[5m])))
          > 0.05)) or (((((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0))) >= 5) unless (((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0))) > 10) unless (min_over_time(((100 * (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",http_status_code=~"5..",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          or 0 * sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          / (sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m]))
          > 0)))[10m:1m]) >= 5)) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"google-registry|api-recommendation|ai-accessibility|ai-validation|ai-assistant"}[5m])))
          > 0.05))
        datasource:
          type: prometheus
          uid: prometheus
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}): {{ printf "%.1f" $values.B.Value }} % de respostas 5xx'
      description: Taxa de erros 5xx de 5 % ou mais por 5 minutos, ainda sem ter completado 10 minutos nem passado de 10 %.
      impact: Início de um problema de erros; ainda pode ser um pico.
      first_steps: 1. Acompanhar por mais 5 minutos. 2. Se persistir, vira P1 (A03). 3. Olhar rotas e logs de erro.
      dashboard: '{{ if or (eq $labels.service_name "auth") (eq $labels.service_name "core") (eq $labels.service_name "messager") (eq $labels.service_name
        "api-notify") }}/d/solier-servico-java{{ else }}/d/solier-servico-python{{ end }}?var-service={{ $labels.service_name }}&var-environment={{
        $labels.deployment_environment }}'
    labels:
      alert_id: A04
      priority: P2
      category: erros
      team: solier
      escalation_group: erro-5xx
  - uid: solier-a06
    title: A06 Latência crítica (central)
    condition: C
    for: 10m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (((histogram_quantile(0.95, sum by (service_name,deployment_environment,le) (rate(http_server_requests_milliseconds_bucket{deployment_environment="prod",uri!~"/actuator.*|UNKNOWN",service_name=~"auth|core|messager",status=~"2..|3.."}[5m]))))
          >= 2000) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_requests_milliseconds_count{deployment_environment="prod",uri!~"/actuator.*",service_name=~"auth|core|messager"}[5m])))
          > 0.05)) or (((histogram_quantile(0.95, sum by (service_name,deployment_environment,le) (rate(http_server_duration_milliseconds_bucket{deployment_environment="prod",http_target!~"/health|",service_name=~"api-recommendation|ai-assistant",http_status_code=~"2..|3.."}[5m]))))
          >= 2000) and on(service_name,deployment_environment) ((sum by (service_name,deployment_environment) (rate(http_server_duration_milliseconds_count{deployment_environment="prod",http_target!~"/health",service_name=~"api-recommendation|ai-assistant"}[5m])))
          > 0.05))
        datasource:
          type: prometheus
          uid: prometheus
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}): p95 de {{ printf "%.1f" $values.B.Value }} ms'
      description: Latência p95 (respostas 2xx e 3xx) de 2000 ms ou mais por 10 minutos.
      impact: 'Serviço central lento: o usuário percebe a demora.'
      first_steps: 1. Ver a latência por rota. 2. Ver as dependências (banco, chamadas externas). 3. Ver heap e GC.
      dashboard: '{{ if or (eq $labels.service_name "auth") (eq $labels.service_name "core") (eq $labels.service_name "messager") (eq $labels.service_name
        "api-notify") }}/d/solier-servico-java{{ else }}/d/solier-servico-python{{ end }}?var-service={{ $labels.service_name }}&var-environment={{
        $labels.deployment_environment }}'
    labels:
      alert_id: A06
      priority: P2
      category: latencia
      team: solier
      escalation_group: latencia
  - uid: solier-a10
    title: A10 Usuário não provisionado
    condition: C
    for: 0s
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum by (service_name, deployment_environment) (count_over_time({deployment_environment="prod", service_name="auth"} |= "CORE_PROVISIONING_DLQ"
          [5m])) > 0
        datasource:
          type: loki
          uid: loki
        queryType: instant
        maxLines: 100
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: '{{ $labels.service_name }} ({{ $labels.deployment_environment }}): usuário não provisionado no core'
      description: O auth esgotou as tentativas de criar o usuário no api-core e gravou CORE_PROVISIONING_DLQ (janela de 5 minutos).
      impact: 'Um usuário foi criado no auth e não no core: o cadastro fica incompleto.'
      first_steps: 1. Pegar o authId no log. 2. Ver se o api-core estava fora. 3. Reprocessar o usuário na fila de falhas.
      dashboard: /d/solier-servico-java?var-service={{ $labels.service_name }}&var-environment={{ $labels.deployment_environment }}
    labels:
      alert_id: A10
      priority: P2
      category: negocio
      team: solier
  - uid: solier-a12
    title: A12 Pool de conexões saturado
